<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IdeaGrid</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="glow-overlay"></div>
    
    <!--bubbles -->
    <div class="bubble-wrapper">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <header>
        <div class="brand">
            <h1>Idea<span>Grid</span></h1>
            <p id="board-stats">0 Items</p>
        </div>

        <nav id="controls">
            <input type="text" id="search-input" placeholder="Filter items...">
            <button id="add-column-btn" class="secondary-btn">+ Add Column</button>
            <button id="open-modal-btn" class="primary-btn">New Item</button>
        </nav>
    </header>

    <main id="column-container">
        <!--columns and cards injected by script.js -->
    </main>

    <div id="modal-overlay" class="hidden">
        <div class="modal">
            <h2>New Item</h2>
            <form id="idea-form">
                <div class="form-group">
                    <label>Entry Type</label>
                    <div class="type-selector">
                        <button type="button" class="type-btn active" data-type="note">Note</button>
                        <button type="button" class="type-btn" data-type="todo">To-Do</button>
                        <button type="button" class="type-btn" data-type="image">Image</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" required placeholder="Item title...">
                </div>

                <div id="dynamic-content-area" class="form-group">
                    <label for="content">Description</label>
                    <textarea id="content" placeholder="Enter details..."></textarea>
                </div>

                <div class="form-group">
                    <label for="header-color">Header Accent Color</label>
                    <input type="color" id="header-color" value="#64ffda">
                </div>

                <div class="form-group">
                    <label for="column-select">Target Column</label>
                    <select id="column-select"></select>
                </div>

                <div class="modal-actions">
                    <button type="button" id="close-modal">Cancel</button>
                    <button type="submit" class="primary-btn">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
